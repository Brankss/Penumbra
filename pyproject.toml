[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "penumbra-research"
version = "0.1.1"
description = "Privacy-native deep research agent. Multi-step research without leaving fingerprints."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Penumbra Contributors" },
]
keywords = [
    "ai",
    "agent",
    "privacy",
    "research",
    "tor",
    "llm",
    "deep-research",
    "anonymous",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "playwright>=1.45",
    "stem>=1.8",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
ollama = ["ollama>=0.3"]
all = [
    "anthropic>=0.34",
    "openai>=1.40",
    "ollama>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[project.scripts]
penumbra = "penumbra.cli:app"

[project.urls]
Homepage = "https://github.com/Brankss/Penumbra"
Documentation = "https://github.com/Brankss/Penumbra#readme"
Repository = "https://github.com/Brankss/Penumbra"
Issues = "https://github.com/Brankss/Penumbra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/penumbra"]

[tool.hatch.build.targets.sdist]
include = [
    "src/penumbra",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "B",
    "C4",
    "UP",
    "ASYNC",
    "S",
    "RET",
    "SIM",
]
ignore = [
    "S101",
    "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"examples/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
