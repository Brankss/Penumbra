name: Bug report
description: Something in Penumbra is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        I ran `penumbra "..." --privacy high` and ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short code snippet or CLI invocation that reproduces the bug.
      render: python
      placeholder: |
        from penumbra import Researcher
        ...
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or error output
      render: shell
    validations:
      required: false

  - type: input
    id: penumbra-version
    attributes:
      label: Penumbra version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: privacy-level
    attributes:
      label: Privacy level in use
      options:
        - "off"
        - "low"
        - "medium"
        - "high"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: llm-info
    attributes:
      label: LLM provider in use
      placeholder: "Anthropic (claude-sonnet-4-6) / OpenAI / Ollama"
    validations:
      required: false
