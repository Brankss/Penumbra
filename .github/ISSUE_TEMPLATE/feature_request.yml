name: Feature request
description: Propose a new feature for Penumbra.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the use case. What can't you do today that this feature would
        enable? Concrete scenarios beat abstract wishes.
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API or behavior
      description: |
        Sketch what the feature would look like to users — a code snippet,
        a CLI flag, a config option.
      render: python
    validations:
      required: false

  - type: textarea
    id: threat-model
    attributes:
      label: Threat-model impact
      description: |
        Does this feature touch privacy guarantees? If yes, how do we preserve
        the existing guarantees (or make the trade-off opt-in)?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they don't work.
    validations:
      required: false
